# https://taskfile.dev
version: '3'

dotenv: [".env"]

tasks:
  format_dotfiles:
    cmds:
      - yamlfmt .
      - taplo format AppData/Roaming/yazi/config/yazi.toml
      - stylua .
  export_scoop_list_installed:
    cmds:
      - scoop export > my-scoop-packages.json
  install_tools:
    cmds:
      - scoop import my-scoop-packages.json
      - choco install font-hackgen
      - choco install font-hackgen-nerd
  install_chocolatey:
    cmds:
      - Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
  install_scoop:
    # [Scoop](https://scoop.sh/)
    # powershell上で実行すること
    cmds:
      - Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
      - Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
  oco-llama:
    cmds:
      - llama-server -m $MY_GGUF_PATH -ngl 0 -rea off --port 8080 -c 2048 -np 1 &
      - |
        echo "Waiting for llama-server to be ready..."
        # 「sleep 1」の代わりに、自分自身に2回ピンを飛ばして約1秒消費させます
        until curl -fs http://localhost:8080/health > /dev/null; do ping 127.0.0.1 -n 2 > /dev/null; done
      - oco
      - taskkill /F /IM llama-server.exe 2>nul || exit 0
